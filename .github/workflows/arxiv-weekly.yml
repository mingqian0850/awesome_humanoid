name: Weekly arXiv scan

on:
  schedule:
    # 每周一、周四 01:00 UTC 自动扫描（两次机会：arXiv 偶发 429 限流时不至于整周漏扫）
    - cron: '0 1 * * 1'
    - cron: '0 1 * * 4'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

# 避免手动触发与定时任务并发（并发推送 marker 会互相冲突）
concurrency:
  group: arxiv-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run arXiv sweep
        id: sweep
        run: |
          python3 scripts/arxiv_scan.py > /tmp/scan_body.md
          # 只有正文里真的含候选条目（- ** 开头）才开 Issue，避免空 Issue
          if grep -q '^- \*\*' /tmp/scan_body.md; then
            echo "has_candidates=yes" >> "$GITHUB_OUTPUT"
          else
            echo "has_candidates=no" >> "$GITHUB_OUTPUT"
            echo "本次扫描无新候选，跳过 Issue 创建"
          fi

      # 脚本每次都会推进 marker（避免被跳过的论文每周重复出现），
      # 因此这一步无条件执行；推送失败（例如与人工提交竞争）不应让整个任务失败。
      - name: Commit scan marker
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/.last_scan
          git commit -m "chore: advance arXiv scan marker" -q || true
          git pull --rebase --autostash -q origin main || true
          git push -q origin HEAD:main || echo "marker push skipped (concurrent update)"

      - name: Open issue with candidates
        if: steps.sweep.outputs.has_candidates == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "arXiv 新论文候选（自动扫描 $(date -u +%Y-%m-%d)）" \
            --body-file /tmp/scan_body.md
