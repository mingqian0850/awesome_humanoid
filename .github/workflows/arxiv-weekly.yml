name: Weekly arXiv scan

on:
  schedule:
    # 每周一 01:00 UTC 自动扫描
    - cron: '0 1 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run arXiv sweep
        id: sweep
        run: |
          python3 scripts/arxiv_scan.py > /tmp/scan_body.md
          # 只有正文里真的含候选条目（- ** 开头）才继续，避免空 Issue
          if grep -q '^- \*\*' /tmp/scan_body.md; then
            echo "has_candidates=yes" >> "$GITHUB_OUTPUT"
          else
            echo "has_candidates=no" >> "$GITHUB_OUTPUT"
            echo "本次扫描无新候选，跳过 Issue 创建"
          fi

      - name: Update scan marker
        if: steps.sweep.outputs.has_candidates == 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/.last_scan
          git commit -m "chore: advance arXiv scan marker" -q || true
          git push -q

      - name: Open issue with candidates
        if: steps.sweep.outputs.has_candidates == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "arXiv 新论文候选（自动扫描 $(date -u +%Y-%m-%d)）" \
            --body-file /tmp/scan_body.md
