name: Weekly arXiv scan

on:
  schedule:
    # 每周一 01:00 UTC 自动扫描
    - cron: '0 1 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run arXiv sweep
        id: sweep
        run: |
          python3 scripts/arxiv_scan.py > /tmp/scan_body.md
          echo "body_size=$(wc -c < /tmp/scan_body.md)" >> "$GITHUB_OUTPUT"

      - name: Update scan marker
        if: steps.sweep.outputs.body_size != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/.last_scan
          git commit -m "chore: advance arXiv scan marker" -q || true
          git push -q

      - name: Open issue with candidates
        if: steps.sweep.outputs.body_size != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "arXiv 新论文候选（自动扫描 $(date -u +%Y-%m-%d)）" \
            --body-file /tmp/scan_body.md
